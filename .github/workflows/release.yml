# Tag-triggered multi-platform release builds (Tauri 2 + tauri-action).
# Push a version tag (e.g. v1.0.0); CI syncs package.json / tauri.conf.json /
# Cargo.toml from the tag before building. Or run manually via workflow_dispatch.
#
# Asset names use a platform suffix so downloads are easy to pick:
#   macOS Apple Silicon → *_macos-apple-silicon.dmg
#   macOS Intel         → *_macos-intel.dmg
#   Windows x64/x86/ARM → *_windows-{x64|x86|arm64}[.msi|-setup.exe|.exe]
#   Linux x64           → *_linux-x64.AppImage / .deb / .rpm
#
# Windows also uploads a portable .exe (uploadPlainBinary) for each arch —
# double-click to run; still needs WebView2 (usually preinstalled on Win10/11).
# ARM64: NSIS + portable only (WiX MSI does not support aarch64).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0). Required for manual runs.'
        required: true
        type: string

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            asset_name: '[name]_[version]_macos-apple-silicon.[ext]'
            upload_plain: false
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            asset_name: '[name]_[version]_macos-intel.[ext]'
            upload_plain: false
          - platform: ubuntu-22.04
            rust_target: ''
            args: ''
            asset_name: '[name]_[version]_linux-x64.[ext]'
            upload_plain: false
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            asset_name: '[name]_[version]_windows-x64[setup].[ext]'
            upload_plain: true
          - platform: windows-latest
            rust_target: i686-pc-windows-msvc
            args: --target i686-pc-windows-msvc
            asset_name: '[name]_[version]_windows-x86[setup].[ext]'
            upload_plain: true
          # Native ARM runner — avoids fragile x64→ARM64 MSVC cross setup.
          - platform: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            # MSI (WiX) does not support aarch64 — NSIS + portable exe only.
            args: --target aarch64-pc-windows-msvc --bundles nsis
            asset_name: '[name]_[version]_windows-arm64[setup].[ext]'
            upload_plain: true
    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.platform }}${{ matrix.rust_target && format(' ({0})', matrix.rust_target) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Sync version from tag / input
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: node scripts/sync-version-from-tag.mjs

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.rust_target || matrix.platform }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Catpasswd Hash Extract v__VERSION__'
          releaseBody: |
            First public release of a cross-platform, local hash extractor — a native alternative to scattered John `*2john` scripts, with a unified result contract for John, hashcat, and other crackers.

            ### Features

            - **Multi-format file extraction (File tab)**
              - Archives: ZIP (ZipCrypto / WinZip AES), RAR3 (`-hp`), RAR5, 7-Zip
              - Documents: Microsoft Office (2007 / 2010 / 2013+), legacy Excel 97–2003 (RC4), PDF (revisions 2–6)
            - **BitLocker volume extraction (Disk tab, Windows)**
              - Enumerate physical disks and partitions
              - Extract password-protected VMK hashes (hashcat `-m 22100`)
            - **Unified result contract**
              - Stable `HashResult` (hash line, hashcat mode, warnings / errors)
              - Copy to clipboard and export `.hash` files
            - **Desktop app**
              - Windows / macOS / Linux installers (Tauri 2)
              - Window title shows the app version
              - Updated application icon

            ### Fixes (since early builds)

            - Fixed ZIP hashes that John could not recognize
            - Fixed missed detection for legacy Office hashes
            - Fixed 7z hash not correct issue

            ### Notes

            - Use only on files or volumes you own or are authorized to recover
            - Extraction runs locally; source files do not need to leave your machine
            - See `docs/architecture.md` for the format roadmap

            ### Downloads

            Download the installer for your platform from the assets below:

            | Platform | Asset suffix |
            |----------|--------------|
            | macOS Apple Silicon (M1/M2/M3/M4) | `*_macos-apple-silicon.dmg` |
            | macOS Intel | `*_macos-intel.dmg` |
            | Windows x64 | `*_windows-x64.msi` / `*-setup.exe` / portable `*.exe` |
            | Windows x86 (32-bit) | `*_windows-x86.msi` / `*-setup.exe` / portable `*.exe` |
            | Windows ARM64 | `*_windows-arm64-setup.exe` / portable `*.exe` |
            | Linux | `*_linux-x64.AppImage` / `.deb` / `.rpm` |

            **Windows portable `.exe`:** run directly without installing. Still requires
            the WebView2 Runtime (preinstalled on most Windows 10/11 machines).

            On Apple Silicon, use the apple-silicon DMG. The Intel build runs under
            Rosetta and may show a soon-unsupported warning.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadPlainBinary: ${{ matrix.upload_plain }}
          uploadUpdaterJson: false
